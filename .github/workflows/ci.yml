name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

# Least-privilege by default (wargames/elevate-security.md M1): the token gets
# read-only, and no job here needs more. Actions pinned to SHAs (M2).
permissions:
  contents: read

jobs:
  python:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Full range declared by pyproject's requires-python = ">=3.10".
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package + test tooling
        # Installing the package itself (-e .) exercises pyproject's declared
        # dependencies - a missing dep (like the once-undeclared numpy) now
        # fails CI instead of being papered over by a manual install list.
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio ruff
      - name: Lint
        run: ruff check src tests
      - name: Run pytest
        # pythonpath is set in pyproject [tool.pytest.ini_options]; no manual
        # PYTHONPATH prefix needed.
        run: python -m pytest tests -q

  typescript:
    name: TypeScript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Test
        # Shell-expanded single-level glob (test files are flat in dist/test/),
        # avoiding node's version-dependent "**" glob support.
        run: node --test dist/test/*.test.js
