version: 2

# A `cooldown` holds every update back a few days after release. This is the
# direct defense against the 2026 worm class (Shai-Hulud -> ChainDrop): malicious
# versions are typically yanked within hours-to-days of publish, so waiting out
# that window means Dependabot never opens a PR for a compromised release in the
# first place. Security-relevant majors get a shorter hold than routine minors.
# (wargames/elevate-security.md M11)
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
      semver-major-days: 3
    # gradio pins gradio-client exactly, so bumping one alone breaks the
    # Space build (2026-09-10, #316). Move them in one PR.
    # pydantic pins pydantic-core exactly too, so the same class of break hit
    # #463's requirements.txt (2026-09-21): pydantic-core alone can't resolve
    # against pydantic's exact pin. Move them in one PR.
    # mcp pins mcp-types exactly too, so the same class of break hit #533's
    # requirements.txt (2026-09-23): mcp==2.2.0 requires mcp-types==2.2.0, so
    # bumping mcp alone while mcp-types stays pinned at 2.1.1 can't resolve.
    # anyio needs a typing-extensions floor that moves independently, so the
    # same class of break hit #532's requirements.txt (2026-09-23): anyio
    # 4.15.1 requires typing_extensions>=4.16.0, which the pinned
    # typing-extensions==4.15.0 line alone can't satisfy.
    groups:
      gradio:
        patterns: ["gradio", "gradio-client"]
      pydantic:
        patterns: ["pydantic", "pydantic-core"]
      mcp:
        patterns: ["mcp", "mcp-types"]
      anyio:
        patterns: ["anyio", "typing-extensions"]
    # gradio (through 6.28.0) requires tomlkit<0.15.0, so 0.15.x can never
    # resolve in the Space requirements job (#419). Lift when gradio lifts the cap.
    ignore:
      - dependency-name: "tomlkit"
        versions: [">=0.15.0"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
      semver-major-days: 3
  - package-ecosystem: npm
    directory: /ts
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
      semver-major-days: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
