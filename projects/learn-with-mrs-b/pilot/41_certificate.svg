<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1100" width="850" height="1100">
  <rect width="850" height="1100" fill="#ffffff"/>
  <!-- Ornate Golden/Black Triple Border -->
  <rect x="35" y="35" width="780" height="1030" rx="30" fill="none" stroke="#111111" stroke-width="5"/>
  <rect x="50" y="50" width="750" height="1000" rx="22" fill="none" stroke="#b8860b" stroke-width="2"/>
  <rect x="62" y="62" width="726" height="976" rx="16" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="8,4"/>
  
  <!-- Ribbon Seal Header -->
  <text x="425" y="150" font-family="Georgia, serif" font-size="42" font-weight="bold" text-anchor="middle" fill="#111111" letter-spacing="3">CERTIFICATE</text>
  <text x="425" y="195" font-family="Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" fill="#b8860b">OF ACCOMPLISHMENT &amp; ENGLISH MASTERY</text>
  
  <!-- Body text -->
  <text x="425" y="290" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" fill="#333333">This official certificate proudly celebrates</text>
  
  <!-- Student Name Line -->
  <line x1="140" y1="390" x2="710" y2="390" stroke="#111111" stroke-width="3"/>
  <line x1="140" y1="420" x2="710" y2="420" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="425" y="445" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#888888">STUDENT STAR ARTIST &amp; ESOL SCHOLAR</text>
  
  <text x="425" y="510" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="#333333">for successfully reading, speaking, tracing, and coloring</text>
  <text x="425" y="545" font-family="Georgia, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111">All 40 Pages with Mrs. B!</text>
  
  <!-- 4 Mastery Stars -->
  <g transform="translate(425, 650)">
    <g transform="translate(-225, 0)">
      <polygon points="0,-25 7,-8 25,-8 11,3 16,21 0,10 -16,21 -11,3 -25,-8 -7,-8" fill="#ffd700" stroke="#111111" stroke-width="2"/>
      <text x="0" y="40" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">I Can Speak!</text>
    </g>
    <g transform="translate(-75, 0)">
      <polygon points="0,-25 7,-8 25,-8 11,3 16,21 0,10 -16,21 -11,3 -25,-8 -7,-8" fill="#ffd700" stroke="#111111" stroke-width="2"/>
      <text x="0" y="40" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">I Can Read!</text>
    </g>
    <g transform="translate(75, 0)">
      <polygon points="0,-25 7,-8 25,-8 11,3 16,21 0,10 -16,21 -11,3 -25,-8 -7,-8" fill="#ffd700" stroke="#111111" stroke-width="2"/>
      <text x="0" y="40" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">I Can Write!</text>
    </g>
    <g transform="translate(225, 0)">
      <polygon points="0,-25 7,-8 25,-8 11,3 16,21 0,10 -16,21 -11,3 -25,-8 -7,-8" fill="#ffd700" stroke="#111111" stroke-width="2"/>
      <text x="0" y="40" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">I Can Color!</text>
    </g>
  </g>

  <!-- Signatures -->
  <g transform="translate(0, 840)">
    <line x1="120" y1="50" x2="380" y2="50" stroke="#111111" stroke-width="2"/>
    <text x="250" y="75" font-family="Georgia, serif" font-size="18" font-style="italic" text-anchor="middle" fill="#111111">Mrs. Faustine B. Meralus, M.Ed.</text>
    <text x="250" y="95" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#666666">Master Educator &amp; ESOL Specialist</text>

    <line x1="470" y1="50" x2="730" y2="50" stroke="#111111" stroke-width="2"/>
    <text x="600" y="75" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111111">Date Awarded</text>
    <text x="600" y="95" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#666666">LearnWithMrsB.com</text>
  </g>

  <!-- Gold Stamp Medal -->
  <g transform="translate(425, 870)">
    <circle cx="0" cy="0" r="46" fill="#ffd700" stroke="#111111" stroke-width="3"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="0" y="-5" font-family="Georgia, serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#111111">OFFICIAL</text>
    <text x="0" y="10" font-family="Georgia, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">SEAL</text>
    <text x="0" y="24" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" fill="#111111">EXCELLENCE</text>
  </g>
</svg>