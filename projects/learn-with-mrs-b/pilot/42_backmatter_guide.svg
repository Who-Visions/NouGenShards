<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1100" width="850" height="1100">
  <rect width="850" height="1100" fill="#ffffff"/>
  <!-- Outer Rounded Border -->
  <rect x="40" y="40" width="770" height="1020" rx="28" fill="none" stroke="#111111" stroke-width="4"/>
  <rect x="55" y="55" width="740" height="990" rx="20" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- Header -->
  <text x="425" y="110" font-family="Georgia, serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#111111">PARENT &amp; EDUCATOR LEARNING GUIDE</text>
  <text x="425" y="140" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" text-anchor="middle" fill="#555555">How to Maximize Bilingual Growth with Mrs. B</text>

  <!-- Box 1: The 4 Golden Rules -->
  <rect x="80" y="170" width="690" height="230" rx="14" fill="#fafafa" stroke="#dddddd" stroke-width="1.5"/>
  <text x="105" y="205" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111111">⭐ The 4 Golden Rules for Home &amp; Classroom Practice</text>
  
  <text x="105" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#333333">1. 10–15 Minute Micro-Sessions:</text>
  <text x="125" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Keep daily sessions short, playful, and joyful. Focus on one 5-page unit per week.</text>

  <text x="105" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#333333">2. Talk Before You Color ("SEE &amp; SAY" First):</text>
  <text x="125" y="310" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Always model the oral sentence frame ("I feel happy", "This is my mom") before coloring.</text>

  <text x="105" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#333333">3. Home-Language Validation (Kreyòl / Español / Français):</text>
  <text x="125" y="360" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Celebrate answers in your native home language first, then bridge to the English frame.</text>

  <text x="105" y="385" font-family="Arial, Helvetica, sans-serif" font-size="12" font-style="italic" fill="#777777">"Ou fè yon bèl travay! You did a wonderful job!"</text>

  <!-- Box 2: Master 50-Word Vocabulary Index -->
  <rect x="80" y="420" width="690" height="290" rx="14" fill="#fafafa" stroke="#dddddd" stroke-width="1.5"/>
  <text x="105" y="450" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111111">📚 Master 50-Word Vocabulary Index (Check as you master!)</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333">
    <!-- Col 1: Units 1-2 -->
    <text x="105" y="480" font-weight="bold" fill="#111111">Unit 1: Feelings</text>
    <text x="105" y="500">☐ happy</text><text x="105" y="518">☐ sad</text><text x="105" y="536">☐ excited</text><text x="105" y="554">☐ calm</text><text x="105" y="572">☐ friend</text>

    <text x="105" y="605" font-weight="bold" fill="#111111">Unit 2: Family</text>
    <text x="105" y="625">☐ mom</text><text x="105" y="643">☐ dad</text><text x="105" y="661">☐ grandma</text><text x="105" y="679">☐ grandpa</text><text x="105" y="697">☐ baby</text>

    <!-- Col 2: Units 3-4 -->
    <text x="280" y="480" font-weight="bold" fill="#111111">Unit 3: School</text>
    <text x="280" y="500">☐ book</text><text x="280" y="518">☐ pencil</text><text x="280" y="536">☐ desk</text><text x="280" y="554">☐ teacher</text><text x="280" y="572">☐ school</text>

    <text x="280" y="605" font-weight="bold" fill="#111111">Unit 4: Shapes &amp; Colors</text>
    <text x="280" y="625">☐ red</text><text x="280" y="643">☐ blue</text><text x="280" y="661">☐ circle</text><text x="280" y="679">☐ square</text><text x="280" y="697">☐ star</text>

    <!-- Col 3: Units 5-6 -->
    <text x="450" y="480" font-weight="bold" fill="#111111">Unit 5: Food &amp; Needs</text>
    <text x="450" y="500">☐ apple</text><text x="450" y="518">☐ banana</text><text x="450" y="536">☐ bread</text><text x="450" y="554">☐ water</text><text x="450" y="572">☐ milk</text>

    <text x="450" y="605" font-weight="bold" fill="#111111">Unit 6: Animals &amp; Verbs</text>
    <text x="450" y="625">☐ dog</text><text x="450" y="643">☐ bird</text><text x="450" y="661">☐ fish</text><text x="450" y="679">☐ run</text><text x="450" y="697">☐ jump</text>

    <!-- Col 4: Units 7-8 -->
    <text x="620" y="480" font-weight="bold" fill="#111111">Unit 7: Community</text>
    <text x="620" y="500">☐ doctor</text><text x="620" y="518">☐ firefighter</text><text x="620" y="536">☐ hospital</text><text x="620" y="554">☐ park</text><text x="620" y="572">☐ bus</text>

    <text x="620" y="605" font-weight="bold" fill="#111111">Unit 8: Mastery</text>
    <text x="620" y="625">☐ read</text><text x="620" y="643">☐ write</text><text x="620" y="661">☐ speak</text><text x="620" y="679">☐ color</text><text x="620" y="697">☐ I can!</text>
  </g>

  <!-- Box 3: About Mrs. B -->
  <rect x="80" y="730" width="690" height="260" rx="14" fill="#fafafa" stroke="#dddddd" stroke-width="1.5"/>
  <text x="105" y="765" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#111111">About Mrs. Faustine B. Meralus, M.Ed. (Mrs. B)</text>
  
  <text x="105" y="800" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333333">Mrs. Faustine B. Meralus is a master classroom educator with over 25 years of teaching experience</text>
  <text x="105" y="820" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333333">in South Florida public and private schools. A proud Florida Atlantic University alumna (FAU Class of 2001)</text>
  <text x="105" y="840" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333333">with a Master's degree in Educational Leadership and an ESOL Specialization, Mrs. B has dedicated her</text>
  <text x="105" y="860" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333333">life to empowering immigrant children and multilingual diaspora families through literacy and joy.</text>

  <line x1="105" y1="890" x2="745" y2="890" stroke="#eeeeee" stroke-width="1"/>
  
  <text x="425" y="920" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">Continue Learning Online with Mrs. B!</text>
  <text x="425" y="942" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0066cc">Tutoring, Live Lessons &amp; Resources: www.LearnWithMrsB.com</text>
  <text x="425" y="965" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#888888">Who Visions · NouGen Publishing · Palm Beach County, Florida</text>
</svg>