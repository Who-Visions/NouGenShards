<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1100" width="850" height="1100">
  <rect width="850" height="1100" fill="#ffffff"/>
  <!-- Subtle Outer Rounded Border (Matching Single-Sided KDP Framing) -->
  <rect x="40" y="40" width="770" height="1020" rx="28" fill="none" stroke="#e0e0e0" stroke-width="1.5" stroke-dasharray="8,8"/>
  
  <!-- Center Watermark / Protective Note -->
  <g transform="translate(425, 530)" opacity="0.6">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#cccccc" stroke-width="1.5"/>
    <text x="0" y="8" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" fill="#999999">🖍️</text>
    <text x="0" y="65" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#888888">PROTECTIVE BLEED-GUARD PAGE</text>
    <text x="0" y="88" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#aaaaaa">Left blank to protect your next masterpiece from marker bleed.</text>
  </g>

  <!-- Footer Brand Tag -->
  <text x="425" y="1020" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#cccccc">Learn With Mrs. B · Single-Sided KDP Edition</text>
</svg>