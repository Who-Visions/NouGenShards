<!doctype html>
<html lang="en" data-theme="dark">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="nougen-tokens.css">
<link rel="stylesheet" href="popup.css">
<main>
  <div class="popup-header">
    <h1>NouGen</h1>
    <div id="node-status" class="status-badge" role="status">
      <span class="dot"></span>
      <span id="node-name">Checking...</span>
    </div>
  </div>

  <div id="tab-info" class="tab-preview">
    <div id="tab-title" class="tab-title">Loading tab...</div>
    <div id="tab-badge" class="badge"></div>
  </div>

  <button id="capture">Capture selection / page</button>
  <button id="tube">Send video to NouGenTube</button>

  <label for="extra-tags">Tags (optional, comma-separated)</label>
  <input id="extra-tags" placeholder="e.g. prompt, python, ai" autocomplete="off">

  <label for="goal">Destiny goal (optional)</label>
  <input id="goal" placeholder="What should this page become?" autocomplete="off">
  <button id="morph">Morph page into shards</button>

  <div id="progress-card" class="progress-card" style="display: none;">
    <div class="progress-bar-wrap">
      <div id="progress-fill" class="progress-bar-fill"></div>
    </div>
    <div class="progress-status-row">
      <span class="spinner"></span>
      <span id="progress-text" class="progress-status-text">Processing...</span>
    </div>
  </div>

  <p id="msg" class="meta" role="status"></p>

  <div class="footer-links">
    <a id="sidepanel-link" href="#" class="meta">Open Side Panel</a>
    <a id="opts" href="#" class="meta">Options</a>
  </div>
</main>
<script type="module" src="popup.js"></script>
</html>
