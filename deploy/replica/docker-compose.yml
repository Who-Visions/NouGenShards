# Read-only shards replica: search/recall over a SNAPSHOT of the vaults.
# - Snapshots come from ./snapshot.sh, mounted :ro. Live ~/.nougen/shards is never mounted.
# - NOUGEN_SNAPSHOT_DIR turns on snapshot_mode: every DB opens immutable=1&mode=ro,
#   so WAL-mode backups read cleanly from a read-only mount.
# - No Keymaker inside (macOS Keychain is unreachable from Linux). Put only
#   NGS_NODE_TOKEN in a local, gitignored replica.env (also in root .dockerignore).
# - Memory capped: phoebus is a 16GB box already deep in swap.
services:
  shards-replica:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: nougenshards-replica:local
    container_name: shards-replica
    ports:
      - "127.0.0.1:7870:7860"
    env_file:
      - path: ./replica.env
        required: false
    environment:
      NOUGEN_HOME: /tmp/nougen
      NOUGEN_VAULT_DIR: /tmp/nougen/vault
      NOUGEN_SNAPSHOT_DIR: /vault
      NOUGEN_SNAPSHOT_LOCALIZE: "0"
      NOUGEN_WARMUP: "0"
      NOUGEN_COVERAGE_FEDERATED: "0"
    volumes:
      - ${REPLICA_DIR:-${HOME}/.nougen/replica}:/vault:ro
    tmpfs:
      - /tmp
    mem_limit: 1g
    restart: unless-stopped
